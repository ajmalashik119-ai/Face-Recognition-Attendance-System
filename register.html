<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Face Registration | FaceAttend System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

            .header h1 {
                color: #1e2a5e;
                font-size: 28px;
                margin-bottom: 8px;
            }

            .header p {
                color: #666;
                font-size: 14px;
            }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

            input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            }

        .webcam-container {
            position: relative;
            margin: 20px 0;
            border-radius: 16px;
            overflow: hidden;
            background: #f0f0f0;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, #capturedImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-capture {
            background: #4CAF50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-primary:hover:not(:disabled),
        .btn-capture:hover:not(:disabled),
        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
            border-left: 4px solid #28a745;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
            border-left: 4px solid #dc3545;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
            border-left: 4px solid #17a2b8;
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .preview-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .requirements {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

            .requirements ul {
                margin-left: 20px;
                margin-top: 5px;
            }

            .requirements li {
                margin: 5px 0;
            }

        @media (max-width: 600px) {
            .registration-container {
                padding: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            button {
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="header">
            <div class="logo">📸</div>
            <h1>Face Registration</h1>
            <p>Register your face for contactless attendance</p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="studentName" required placeholder="Enter your full name" autocomplete="off">
            </div>

            

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="studentEmail" required placeholder="your@email.com" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Capture Your Face *</label>
                <div class="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <img id="capturedImage" style="display: none;" alt="Captured face">
                </div>
                <div class="button-group">
                    <button type="button" class="btn-capture" id="captureBtn">📸 Capture Photo</button>
                    <button type="button" class="btn-secondary" id="retakeBtn" style="display: none;">🔄 Retake</button>
                </div>
                <div class="preview-info" id="previewInfo"></div>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn" disabled>✅ Register Face ID</button>
        </form>

        <div class="spinner" id="spinner"></div>
        <div class="status" id="status"></div>

        <div class="requirements">
            <strong>📋 Requirements:</strong>
            <ul>
                <li>Good lighting on your face</li>
                <li>Look directly at the camera</li>
                <li>Remove glasses or mask for better accuracy</li>
                <li>Ensure your full face is visible</li>
            </ul>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
